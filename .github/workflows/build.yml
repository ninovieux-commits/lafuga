name: Build La Fuga APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.36

      - name: Preparer python-for-android (1er passage)
        run: |
          (yes 2>/dev/null | buildozer android debug) || true

      - name: Contourner la panne Savannah (miroir freetype)
        run: |
          find . -path '*/recipes/freetype/__init__.py' -exec sed -i 's|download.savannah.gnu.org|download-mirror.savannah.gnu.org|g' {} +
          echo "URL freetype redirigee vers le miroir direct."

      - name: Compiler l'APK (2e passage)
        run: |
          (yes 2>/dev/null | buildozer android debug) > build_log.txt 2>&1
          echo "Build termine, code $?"

      - name: Afficher la FIN du journal
        if: always()
        run: |
          echo "=== 60 DERNIERES LIGNES ==="
          tail -n 60 build_log.txt || true

      - name: DIAGNOSTIC FIREBASE
        if: always()
        run: |
          echo "########## 1) LIGNES 'firebase' ##########"
          grep -in firebase build_log.txt | head -50 || echo ">>> AUCUNE ligne firebase trouvee <<<"
          echo ""
          echo "########## 2) SERVICE JAVA (FugaMessaging) ##########"
          grep -in "FugaMessaging" build_log.txt | head -20 || echo ">>> FugaMessagingService non mentionne <<<"
          echo ""
          echo "########## 3) add_src / gradle_dependencies ##########"
          grep -inE "add_src|gradle_dependencies|gradle_depend|Unknown command|Unknown token|not a valid" build_log.txt | head -30 || echo ">>> rien <<<"
          echo ""
          echo "########## 4) RESULTAT GRADLE + ERREURS ##########"
          grep -inE "BUILD SUCCESSFUL|BUILD FAILED|error:|FAILURE:|Could not resolve|Could not find|Duplicate class|Dex" build_log.txt | head -50 || echo ">>> rien <<<"
          echo ""
          echo "########## 5) TAILLE DU JOURNAL ##########"
          wc -l build_log.txt || true

      - name: Sauvegarder le journal complet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build_log.txt

      - name: Publier l'APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafuga-apk-debug
          path: bin/*.apk
          if-no-files-found: warn
